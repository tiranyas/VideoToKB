<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <rect width="200" height="140" rx="8" fill="#03363d"/>
  <!-- Zendesk logo mark - stylized Z shape -->
  <g transform="translate(100,55)">
    <!-- Top triangle -->
    <polygon points="-20,-25 20,-25 -20,0" fill="white"/>
    <!-- Bottom shape -->
    <polygon points="20,0 20,25 -20,25" fill="white"/>
    <!-- Circle top right -->
    <circle cx="20" cy="-13" r="12" fill="white"/>
    <!-- Circle bottom left (half) -->
    <path d="M-20,12 A12,12,0,0,0,-8,0 L-20,0 Z" fill="white"/>
    <path d="M-20,0 A12,12,0,0,1,-8,12 L-20,12 Z" fill="white"/>
  </g>
  <text x="100" y="115" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="11">Help Center</text>
</svg>